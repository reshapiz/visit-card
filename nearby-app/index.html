<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nearby</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/radar.css">
<link rel="stylesheet" href="css/circle.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/detail.css">
</head>
<body data-theme="light">

<div class="page">
  <div class="app-frame" id="appFrame">
    <div class="dynamic-island"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg class="signal" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1" opacity="0.35"/></svg>
        <svg class="wifi" viewBox="0 0 16 11" fill="currentColor"><path d="M8 11l2-2a2.8 2.8 0 0 0-4 0l2 2zm0-4l3.5-3.5a7 7 0 0 0-7 0L8 7zm0-4l5.5-5.5a11 11 0 0 0-11 0L8 3z"/></svg>
        <span class="battery"></span>
      </span>
    </div>

    <main class="screens" id="screens">

      <section class="screen active" data-screen="home">
        <div class="screen-scroll home-scroll">
          <div class="home-header">
            <div class="home-header-top">
              <div>
                <div class="home-eyebrow">Your area</div>
                <button class="home-radius-btn" id="homeRadiusBtn">
                  <span>within <span id="homeRadiusLabel">1 km</span></span>
                </button>
              </div>
              <button class="icon-btn" id="homeSearchBtn" aria-label="Search"></button>
            </div>
            <div class="home-search-row hidden" id="homeSearchRow">
              <input class="field" id="homeSearchInput" placeholder="Search people and happenings">
            </div>
          </div>

          <div class="signal-row" id="signalRow">
            <button class="signal-chip" data-quick="meetup"></button>
            <button class="signal-chip" data-quick="coffee"></button>
            <button class="signal-chip" data-quick="walk"></button>
            <button class="signal-chip signal-chip-accent" id="composeBtn"></button>
          </div>

          <div class="filter-row" id="homeFilters"></div>

          <div class="feed-list" id="feedList"></div>
        </div>
      </section>

      <section class="screen" data-screen="radar">
        <div class="screen-scroll radar-scroll">
          <div class="radar-head">
            <h2>What's around you</h2>
            <p class="radar-sub">Live snapshot of your <span id="radarRadiusLabel">1 km</span> radius</p>
          </div>
          <div class="radar-stage">
            <div class="radar-rings">
              <div class="radar-ring r1"></div>
              <div class="radar-ring r2"></div>
              <div class="radar-ring r3"></div>
              <div class="radar-sweep"></div>
              <div class="radar-dots" id="radarDots"></div>
              <div class="radar-me"><span class="avatar radar-me-avatar"></span></div>
            </div>
            <div class="radar-ring-labels"><span>150 m</span><span>400 m</span><span>800 m</span></div>
          </div>
          <div class="filter-row" id="radarFilters"></div>
          <div class="radar-preview hidden" id="radarPreview"></div>
        </div>
      </section>

      <section class="screen" data-screen="circle">
        <div class="screen-scroll circle-scroll">
          <div class="circle-head">
            <h2>Your circle</h2>
            <p class="circle-sub">Happenings you joined and people you've connected with nearby.</p>
          </div>
          <div class="circle-section">
            <div class="circle-section-title">Joined</div>
            <div class="feed-list" id="circleJoinedList"></div>
          </div>
          <div class="circle-section">
            <div class="circle-section-title">Recent connections</div>
            <div class="connection-list" id="circleConnectionsList"></div>
          </div>
        </div>
      </section>

      <section class="screen" data-screen="profile">
        <div class="screen-scroll profile-screen-scroll">
          <div class="profile-card" id="profileCard">
            <span class="avatar profile-card-avatar g-sunset"><span class="presence-dot" id="profilePresenceDot" data-state="online"></span></span>
            <div class="profile-card-name" id="profileNameLabel"></div>
            <div class="profile-card-handle" id="profileHandleLabel"></div>
            <button class="profile-status-btn" id="profileStatusBtn">
              <span id="profileIntentLabel"></span><span class="row-chevron"></span>
            </button>
          </div>

          <div class="row-group">
            <div class="row" id="rowVisibility">
              <span class="row-icon"></span><span class="row-label">Visible nearby</span>
              <button class="tog on" id="visibilityToggle" role="switch" aria-checked="true"><span></span></button>
            </div>
            <button class="row" id="rowRadius">
              <span class="row-icon"></span><span class="row-label">Discovery radius</span>
              <span class="row-value" id="rowRadiusValue"></span><span class="row-chevron"></span>
            </button>
            <div class="row" id="rowExactLocation">
              <span class="row-icon"></span><span class="row-label">Share exact location</span>
              <button class="tog" id="exactLocationToggle" role="switch" aria-checked="false"><span></span></button>
            </div>
          </div>

          <div class="row-group">
            <button class="row" id="rowAppearance">
              <span class="row-icon"></span><span class="row-label">Appearance</span>
              <span class="row-value" id="rowAppearanceValue"></span><span class="row-chevron"></span>
            </button>
            <div class="row" id="rowNotifications">
              <span class="row-icon"></span><span class="row-label">Notifications</span>
              <button class="tog on" id="notifToggle" role="switch" aria-checked="true"><span></span></button>
            </div>
          </div>

          <div class="row-group">
            <button class="row" id="rowAbout">
              <span class="row-icon"></span><span class="row-label">About you</span><span class="row-chevron"></span>
            </button>
            <button class="row" id="rowSignOut">
              <span class="row-icon"></span><span class="row-label">Sign out</span><span class="row-chevron"></span>
            </button>
          </div>
        </div>
      </section>

    </main>

    <div class="overlay-root" id="overlayRoot"></div>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home"></button>
      <button class="tab" data-tab="radar"></button>
      <button class="tab" data-tab="circle"></button>
      <button class="tab" data-tab="profile"></button>
    </nav>

    <div class="home-indicator"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/detail.js"></script>
<script src="js/home.js"></script>
<script src="js/radar.js"></script>
<script src="js/circle.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
